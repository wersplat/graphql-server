# =============================================================================
# QUERY TYPE
# =============================================================================

"""
Root query type for the Bodega Cats GC GraphQL API.
Provides access to all read operations for users, matches, teams, events, players, leagues, achievements, and analytics.
"""
type Query {
  # User queries
  "Get a specific user by ID"
  getUser(id: ID!): User
  "Get a list of users with pagination"
  getUsers(limit: Int = 10, offset: Int = 0): [User!]!
  
  # Match queries
  "Get a specific match by ID"
  getMatch(id: ID!): Match
  "Get a list of matches with optional filtering and pagination"
  getMatches(
    "Filter by team ID (returns matches where this team participated)"
    teamId: ID
    "Filter by event ID"
    eventId: UUID
    "Filter by match status"
    status: MatchStatus
    "Filter by match stage"
    stage: MatchStage
    "Maximum number of matches to return (defaults to 20)"
    limit: Int = 20
    "Number of matches to skip for pagination (defaults to 0)"
    offset: Int = 0
  ): [Match!]!
  
  # Team queries
  "Get a specific team by ID"
  getTeam(id: ID!): Team
  "Get a list of teams with pagination"
  getTeams(limit: Int = 10, offset: Int = 0): [Team!]!
  
  # Event queries
  "Get a specific event by ID"
  getEvent(id: ID!): Event
  "Get a list of events with optional filtering and pagination"
  getEvents(
    "Filter by event status"
    status: EventStatus
    "Filter by event type"
    eventType: EventType
    "Maximum number of events to return (defaults to 10)"
    limit: Int = 10
    "Number of events to skip for pagination (defaults to 0)"
    offset: Int = 0
  ): [Event!]!
  
  # Player queries
  "Get a specific player by ID"
  getPlayer(id: ID!): Player
  "Get a list of players with optional filtering and pagination"
  getPlayers(
    "Filter by player tier"
    tier: PlayerTier
    "Filter by region"
    region: String
    "Maximum number of players to return (defaults to 20)"
    limit: Int = 20
    "Number of players to skip for pagination (defaults to 0)"
    offset: Int = 0
  ): [Player!]!
  
  # Dashboard Analytics
  "Get dashboard statistics"
  getDashboardStats: DashboardStats!
  
  # Leaderboard Enhancements
  "Get leaderboard with sorting and filtering options"
  getLeaderboard(
    "Maximum number of entries to return (defaults to 50)"
    limit: Int = 50
    "Number of entries to skip for pagination (defaults to 0)"
    offset: Int = 0
    "Filter by player tier"
    tier: PlayerTier
    "Filter by region"
    region: String
    "Sort order (defaults to CURRENT_RP)"
    sortBy: LeaderboardSortBy = CURRENT_RP
  ): [LeaderboardEntry!]!
  
  "Get top performing players"
  getTopPlayers(
    "Maximum number of players to return (defaults to 10)"
    limit: Int = 10
    "Filter by player tier"
    tier: PlayerTier
  ): [LeaderboardEntry!]!
  
  # League and Season queries
  "Get a specific league by ID"
  getLeague(id: ID!): League
  "Get a list of leagues"
  getLeagues(limit: Int = 10, offset: Int = 0): [League!]!
  "Get a specific league season by ID"
  getLeagueSeason(id: ID!): LeagueSeason
  "Get league seasons with optional filtering"
  getLeagueSeasons(
    "Filter by league ID"
    leagueId: String
    "Filter by active status"
    isActive: Boolean
    "Maximum number of seasons to return"
    limit: Int = 10
    "Number of seasons to skip for pagination"
    offset: Int = 0
  ): [LeagueSeason!]!
  
  # Tournament queries
  "Get a specific tournament by ID"
  getTournament(id: ID!): Tournament
  "Get tournaments with optional filtering"
  getTournaments(
    "Filter by tournament status"
    status: EventStatus
    "Filter by tournament format"
    format: TournamentFormat
    "Maximum number of tournaments to return"
    limit: Int = 10
    "Number of tournaments to skip for pagination"
    offset: Int = 0
  ): [Tournament!]!
  
  # Achievement queries
  "Get a specific achievement by ID"
  getAchievement(id: ID!): Achievement
  "Get achievements with optional filtering"
  getAchievements(
    "Filter by achievement category"
    category: AchievementCategory
    "Filter by achievement rarity"
    rarity: AchievementRarity
    "Filter by achievement tier"
    tier: AchievementTier
    "Maximum number of achievements to return"
    limit: Int = 20
    "Number of achievements to skip for pagination"
    offset: Int = 0
  ): [Achievement!]!
  
  # Achievement Rule queries
  "Get a specific achievement rule by ID"
  getAchievementRule(id: ID!): AchievementRule
  "Get achievement rules with optional filtering"
  getAchievementRules(
    "Filter by active status"
    isActive: Boolean
    "Filter by game year"
    gameYear: GameYear
    "Filter by league ID"
    leagueId: String
    "Maximum number of rules to return"
    limit: Int = 20
    "Number of rules to skip for pagination"
    offset: Int = 0
  ): [AchievementRule!]!
  
  # Player Award queries
  "Get player awards for a specific player"
  getPlayerAwards(
    "Player ID to get awards for"
    playerId: ID!
    "Filter by award category"
    category: String
    "Filter by award rarity"
    rarity: AchievementRarity
    "Maximum number of awards to return"
    limit: Int = 20
    "Number of awards to skip for pagination"
    offset: Int = 0
  ): [PlayerAward!]!
  
  # City Crew queries
  "Get a specific city crew by ID"
  getCityCrew(id: ID!): CityCrew
