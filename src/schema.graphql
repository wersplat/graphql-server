  matchId: ID!
  "ID of the player these stats belong to"
  playerId: ID!
  "ID of the team the player was on"
  teamId: ID!
  "Total points scored"
  points: Int!
  "Number of assists"
  assists: Int!
  "Number of rebounds"
  rebounds: Int!
  "Number of steals"
  steals: Int!
  "Number of blocks"
  blocks: Int!
  "Number of turnovers"
  turnovers: Int!
  "Number of fouls"
  fouls: Int!
  "Field goals made"
  fgm: Int!
  "Field goals attempted"
  fga: Int!
  "Three-point shots made"
  threePointsMade: Int!
  "Three-point shots attempted"
  threePointsAttempted: Int!
  "Free throws made"
  ftm: Int!
  "Free throws attempted"
  fta: Int!
  "Plus/minus rating"
  plusMinus: Int!
  "Minutes played in the match"
  minutesPlayed: Int!
  "When the stats record was created"
  createdAt: DateTime!
  "When the stats record was last updated"
  updatedAt: DateTime
}

