"""
Represents a competitive match between two teams.
Matches can be in various stages and have detailed statistics.
"""
type Match {
  "Unique identifier for the match"
  id: ID!
  "Game number within the match series"
  gameNumber: Int
  "Game year (2K24, 2K25, etc.)"
  gameYear: GameYear
  "ID of the league this match belongs to"
  leagueId: String
  "ID of the season this match belongs to"
  seasonId: String
  "ID of the tournament this match belongs to"
  tournamentId: String
  "ID of the first team"
  teamAId: String
  "ID of the second team"
  teamBId: String
  "Current stage of the match (group, finals, etc.)"
  stage: MatchStage
  "Current status of the match"
  status: String
  "Score for team A"
  scoreA: Int
  "Score for team B"
  scoreB: Int
  "ID of the winning team"
  winnerId: String
  "When the match was actually played"
  playedAt: DateTime
  "URL to the match boxscore/stats"
  boxscoreUrl: String
  "Whether the match has been verified"
  verified: Boolean!
  "Possible duplicate match ID"
  possibleDuplicateOf: String
  "Team A details"
  teamA: Team
  "Team B details"
  teamB: Team
  "Winning team details"
  winner: Team
  "League information"
  league: League
  "Season information"
  season: LeagueSeason
  "Tournament information"
  tournament: Tournament
}

"""
Status of a match indicating its current state in the competition.
"""
enum MatchStatus {
  "Match is scheduled but not yet started"
  scheduled
  "Match is currently being played"
  in_progress
  "Match has finished"
  completed
  "Match was cancelled"
  cancelled
  "Match was postponed to a later date"
  postponed
}

"""
Stages of a tournament or competition indicating the round or phase.
"""
enum MatchStage {
  "Regular season matches"
  Regular_Season
  "Group stage matches"
  Group_Play
  "Round 1 matches"
  Round_1
  "Round 2 matches"
  Round_2
  "Round 3 matches"
  Round_3
  "Round 4 matches"
  Round_4
  "Semifinal matches"
  Semi_Finals
  "Championship final match"
  Finals
  "Grand championship final match"
  Grand_Finals
  "League level 1 matches"
  L1
  "League level 2 matches"
  L2
  "League level 3 matches"
  L3
  "League level 4 matches"
  L4
  "League level 5 matches"
  L5
  "Winner bracket round 1"
  W1
  "Winner bracket round 2"
  W2
  "Winner bracket round 3"
  W3
  "Winner bracket round 4"
  W4
  "Loser bracket final"
  LF
  "Winner bracket final"
  WF
}

"""
Represents a team in the Bodega Cats GC platform.
Teams compete in matches and tournaments.
"""
type Team {
  "Unique identifier for the team"
  id: ID!
  "Name of the team"
  name: String!
  "URL to the team logo"
  logoUrl: String
  "Current ranking points"
  currentRp: Float
  "ELO rating for matchmaking"
  eloRating: Float
  "Global rank position"
  globalRank: Int
  "Hybrid score calculation"
  hybridScore: Float
  "Player rank score aggregate"
  playerRankScore: Float
  "Total money won"
  moneyWon: Float
  "Leaderboard tier classification"
  leaderboardTier: String
  "League conference ID"
  lgConf: String
  "League division ID"
  lgDivision: String
  "Team Twitter handle"
  teamTwitter: String
  "Whether the team is currently active"
  isActive: Boolean
  "When the team was created"
  createdAt: DateTime
  "League conference information"
  conference: LeagueConference
  "League division information"
  division: LeagueDivision
}

"""
Represents a city crew that players can be affiliated with.
"""
type CityCrew {
  "Unique identifier for the crew"
  id: ID!
  "Name of the crew"
  crewName: String!
  "URL to the crew logo"
  crewLogo: String
  "When the crew was created"
  createdAt: DateTime!
}

"""
Represents a league in the platform.
"""
type League {
  "Unique identifier for the league"
  id: ID!
  "Name of the league"
  name: String!
  "League abbreviation"
  abbreviation: String
  "League description"
  description: String
  "Whether the league is currently active"
  isActive: Boolean!
  "When the league was created"
  createdAt: DateTime!
}

"""
Represents a league season.
"""
type LeagueSeason {
  "Unique identifier for the season"
  id: ID!
  "Season name"
  name: String!
  "League ID this season belongs to"
  leagueId: String!
  "Season start date"
  startDate: DateTime!
  "Season end date"
  endDate: DateTime!
  "Whether the season is currently active"
  isActive: Boolean!
  "When the season was created"
  createdAt: DateTime!
  "Associated league"
  league: League!
}

"""
Represents a league conference.
"""
type LeagueConference {
  "Unique identifier for the conference"
  id: ID!
  "Conference name"
  name: String!
  "Conference abbreviation"
  abbr: String
  "URL to conference logo"
  confLogo: String
  "When the conference was created"
  createdAt: DateTime!
}

"""
Represents a league division.
"""
type LeagueDivision {
  "Unique identifier for the division"
  id: ID!
  "Division name"
  name: String!
  "Division abbreviation"
  abbr: String
  "Conference ID this division belongs to"
  conferenceId: String
  "URL to division logo"
  divisionLogo: String
  "When the division was created"
  createdAt: DateTime!
  "Associated conference"
  conference: LeagueConference
}

"""
Represents a tournament in the platform.
"""
type Tournament {
  "Unique identifier for the tournament"
  id: ID!
  "Tournament name"
  name: String!
  "Tournament description"
  description: String
  "Tournament format"
  format: TournamentFormat
  "Entry fee for the tournament"
  entryFee: Float
  "Prize pool amount"
  prizePool: Float
  "Maximum number of participants"
  maxParticipants: Int
  "Tournament start date"
  startDate: DateTime
  "Tournament end date"
  endDate: DateTime
  "Tournament status"
  status: EventStatus
  "When the tournament was created"
  createdAt: DateTime!
}

"""
Tournament format types.
"""
enum TournamentFormat {
  "Single elimination tournament"
  SINGLE_ELIMINATION
  "Double elimination tournament"
  DOUBLE_ELIMINATION
  "Swiss system tournament"
  SWISS
  "Round robin tournament"
  ROUND_ROBIN
}

"""
Represents an achievement that can be earned by players.
"""
type Achievement {
  "Unique identifier for the achievement"
  id: ID!
  "Achievement name"
  name: String!
  "Achievement description"
  description: String
  "Achievement category"
  category: AchievementCategory
  "Achievement rarity"
  rarity: AchievementRarity
  "Achievement tier"
  tier: AchievementTier
  "Achievement scope"
  scope: AchievementScope
  "Badge image URL"
  achievementBadge: String
  "Points awarded for this achievement"
  points: Int
  "When the achievement was created"
  createdAt: DateTime!
}

"""
Represents an achievement rule that defines when achievements are awarded.
"""
type AchievementRule {
  "Unique identifier for the rule"
  id: ID!
  "Rule name"
  name: String!
  "Achievement scope"
  scope: AchievementScope!
  "Achievement tier"
  tier: AchievementTier!
  "Rule predicate (JSON)"
  predicate: JSON!
  "Award template (JSON)"
  awardTemplate: JSON
  "Window predicate (JSON)"
  windowPredicate: JSON
  "Window size for evaluation"
  windowSize: Int
  "Whether the rule requires approval"
  requiresApproval: Boolean!
  "Whether the rule is active"
  isActive: Boolean!
  "Game year this rule applies to"
  gameYear: GameYear
  "League ID this rule applies to"
  leagueId: String
  "Season ID this rule applies to"
  seasonId: String
  "When the rule was created"
  createdAt: DateTime!
  "When the rule was last updated"
  updatedAt: DateTime!
}

"""
Represents a player award earned through achievements.
"""
type PlayerAward {
  "Unique identifier for the award"
  id: ID!
  "Player ID who earned the award"
  playerId: String!
  "Achievement ID this award is for"
  achievementId: String
  "Award name"
  name: String!
  "Award description"
  description: String
  "PNG asset URL"
  assetPngUrl: String
  "SVG asset URL"
  assetSvgUrl: String
  "Award category"
  category: String
  "Award rarity"
  rarity: AchievementRarity
  "Award tier"
  tier: AchievementTier
  "Points awarded"
  points: Int
  "When the award was earned"
  awardedAt: DateTime
  "When the award was created"
  createdAt: DateTime!
  "Associated player"
  player: Player!
  "Associated achievement"
  achievement: Achievement
}

"""
Represents a tournament, league, or other competitive event.
Events contain multiple matches and have specific rules and prizes.
"""
type Event {
  "Unique identifier for the event"
  id: ID!
  "Name of the event"
  name: String!
  "Description of the event"
  description: String
  "Type of event (tournament, league, etc.)"
  eventType: EventType
  "Tier level of the event"
  tier: EventTier
  "Current status of the event"
  status: EventStatus
  "Entry fee to participate in the event"
  entryFee: Float!
  "Maximum number of participants allowed"
  maxParticipants: Int
  "Current number of registered participants"
  currentParticipants: Int!
  "When the event starts"
  startDate: DateTime
  "When the event ends"
  endDate: DateTime
  "ID of the user who created the event"
  createdBy: ID!
  "When the event was created"
  createdAt: DateTime!
  "When the event was last updated"
  updatedAt: DateTime
}

"""
Types of competitive events in the platform.
"""
enum EventType {
  "League event with regular season matches"
  League
  "Single elimination or double elimination tournament"
  Tournament
}

"""
Status of an event indicating its current phase.
"""
enum EventStatus {
  "Event is in draft mode and not yet published"
  draft
  "Event is open for registration"
  open
  "Event registration is closed"
  registration_closed
  "Event is currently running"
  in_progress
  "Event has finished"
  completed
  "Event was cancelled"
  cancelled
}

"""
Detailed statistics for a player in a specific match.
These stats are used for rankings and performance analysis.
"""
type PlayerMatchStats {
  "Unique identifier for the stats record"
  id: ID!
