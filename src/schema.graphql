  getCityCrews(limit: Int = 10, offset: Int = 0): [CityCrew!]!
  
  # Conference and Division queries
  "Get a specific league conference by ID"
  getLeagueConference(id: ID!): LeagueConference
  "Get league conferences"
  getLeagueConferences(limit: Int = 10, offset: Int = 0): [LeagueConference!]!
  "Get a specific league division by ID"
  getLeagueDivision(id: ID!): LeagueDivision
